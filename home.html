 <!DOCTYPE html>
<html>
<body style="margin:0; background:black; overflow:hidden;">

<!-- CONTROLS -->
<div id="controls" style="position:absolute; bottom:10px; left:50%; transform:translateX(-50%); z-index:10;">
  <button onclick="goSlide(0)">Gun 1</button>
  <button onclick="goSlide(1)">Gun 2</button>
  <button onclick="goSlide(2)">Gun 3</button>
  <button onclick="goSlide(3)">Gun 4</button>
</div>

<!-- DAMAGE TEXT -->
<div id="info" style="
position:absolute;
bottom:60px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:24px;
z-index:10;
text-align:center;">
Gun 1<br>Damage +5 🔥
</div>

<!-- RENDER AREA -->
<div id="box" style="width:100vw; height:100vh;"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
// Scene
let scene = new THREE.Scene();

// Camera
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 40;

// Renderer
let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById("box").appendChild(renderer.domElement);

// Light
scene.add(new THREE.AmbientLight(0xffffff,1));

// Guns
let gun1, gun2, gun3Group, gun4;

// Gun 1
new THREE.GLTFLoader().load('pubg_mobile_m4_glacier.glb', (gltf)=>{
    gun1 = gltf.scene;
    gun1.scale.set(35,35,35);
    scene.add(gun1);
    gun1.visible = true;
});

// Gun 2
new THREE.GLTFLoader().load('ump-45__aggressor.glb', (gltf)=>{
    gun2 = gltf.scene;
    gun2.scale.set(.8,.8,.8);
    scene.add(gun2);
    gun2.visible = false;
});

// Gun 3
new THREE.GLTFLoader().load('awm_godzilla_animated_4k_textures.glb', (gltf)=>{
    let gun3 = gltf.scene;
    gun3.scale.set(35,35,35);

    gun3Group = new THREE.Group();
    gun3Group.add(gun3);
    scene.add(gun3Group);

    gun3Group.visible = false;
});

// Gun 4
new THREE.GLTFLoader().load('p90_hero_v1.glb', (gltf)=>{
    gun4 = gltf.scene;
    gun4.scale.set(.15,.15,.15);
    scene.add(gun4);
    gun4.visible = false;
});

// Slide Control
let current = 0;

function goSlide(i){
    current = i;

    if(gun1) gun1.visible = (i===0);
    if(gun2) gun2.visible = (i===1);
    if(gun3Group) gun3Group.visible = (i===2);
    if(gun4) gun4.visible = (i===3);

    let texts = [
        "Gun 1<br>Damage +5 🔥",
        "Gun 2<br>Damage -5 ❄️",
        "Gun 3<br>Damage +5 ⚡",
        "Gun 4<br>Damage -5 🧊"
    ];

    document.getElementById("info").innerHTML = texts[i];
}

// Glow
function addGlow(obj){
    obj.traverse(child=>{
        if(child.isMesh){
            child.material.emissive = new THREE.Color(0x00ffff);
            child.material.emissiveIntensity = 1.5;
        }
    });
}

function removeGlow(obj){
    obj.traverse(child=>{
        if(child.isMesh){
            child.material.emissiveIntensity = 0;
        }
    });
}

// Click detection
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();

window.addEventListener("click", (e)=>{
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    let guns = [gun1, gun2, gun3Group, gun4].filter(g=>g);

    let intersects = raycaster.intersectObjects(guns, true);

    if(intersects.length > 0){
        let obj = intersects[0].object;

        while(obj.parent && !guns.includes(obj)){
            obj = obj.parent;
        }

        guns.forEach(g=>removeGlow(g));
        addGlow(obj);
    }
});

// Animate
function animate(){
    requestAnimationFrame(animate);

    if(gun1) gun1.rotation.y += 0.01;
    if(gun2) gun2.rotation.y += 0.01;
    if(gun3Group) gun3Group.rotation.y += 0.01;
    if(gun4) gun4.rotation.y += 0.01;

    renderer.render(scene,camera);
}
animate();

// Resize fix
window.addEventListener("resize", ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
