  <!DOCTYPE html>
<html>
<body style="margin:0; background:black; overflow:hidden;">

<div id="box" style="position:absolute; top:0; left:0; width:100vw; height:100vh;"></div>

<!-- AI BUTTON -->
<button id="startAI" style="
position:absolute;
top:20px;
right:20px;
padding:10px 20px;
font-size:16px;
background:#00ffcc;
border:none;
border-radius:8px;
cursor:pointer;
z-index:10;
">
Start AI Mode
</button>

<!-- ⬅️➡️ BUTTONS -->
<button id="leftBtn" style="position:absolute; left:20px; top:50%; font-size:30px; z-index:10;">⬅️</button>
<button id="rightBtn" style="position:absolute; right:20px; top:50%; font-size:30px; z-index:10;">➡️</button>

<!-- CAMERA -->
<video id="video" autoplay muted playsinline style="
position:absolute;
right:20px;
bottom:20px;
width:220px;
border:2px solid white;
border-radius:10px;
display:none;
z-index:10;
"></video>

<div id="expression" style="
position:absolute;
right:20px;
bottom:250px;
color:white;
font-size:18px;
font-weight:bold;
display:none;
z-index:10;
">
Detecting...
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<script>
// SCENE
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 40;

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById("box").appendChild(renderer.domElement);

// LIGHT
scene.add(new THREE.AmbientLight(0xffffff,0.6));
let glowLight = new THREE.PointLight(0x00ffcc, 2, 100);
scene.add(glowLight);

// SLIDER
let sliderGroup = new THREE.Group();
scene.add(sliderGroup);

let currentIndex = 0;
let spacing = 35;

let guns = [];

function addText(gun, text){
    let canvas = document.createElement("canvas");
    let ctx = canvas.getContext("2d");
    canvas.width = 512;
    canvas.height = 128;

    ctx.fillStyle = "white";
    ctx.font = "40px Arial";
    ctx.textAlign = "center";
    ctx.fillText(text, 256, 70);

    let texture = new THREE.CanvasTexture(canvas);
    let sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture }));

    sprite.scale.set(15,4,1);
    sprite.position.set(0, -10, 0);

    gun.add(sprite);
}

// 🔫 Gun 1
new THREE.GLTFLoader().load('pubg_mobile_m4_glacier.glb', (gltf)=>{
    let gun = gltf.scene;
    gun.scale.set(1000,1000,1000);
    gun.position.set(0,0,0); // ✅ custom
    gun.rotation.set(0, Math.PI/2,0);
    addText(gun,"Damage +5%");
    sliderGroup.add(gun);
    guns[0]=gun;
});

// 🔫 Gun 2
new THREE.GLTFLoader().load('ump-45__aggressor.glb', (gltf)=>{
    let gun = gltf.scene;
    gun.scale.set(1.2,1.2,1.2);
    gun.position.set(30,0,0); // ✅ custom
    gun.rotation.set(0, Math.PI/2,0);
    addText(gun,"Damage -5%");
    sliderGroup.add(gun);
    guns[1]=gun;
});

// 🔫 Gun 3
new THREE.GLTFLoader().load('awm_godzilla_animated_4k_textures.glb', (gltf)=>{
    let gun = gltf.scene;
    gun.scale.set(60,60,60);
    gun.position.set(60,0,0); // ✅ custom
    gun.rotation.set(0, Math.PI/2,0);
    addText(gun,"Damage +5%");
    sliderGroup.add(gun);
    guns[2]=gun;
});

// 🔫 Gun 4
new THREE.GLTFLoader().load('p90_hero_v1.glb', (gltf)=>{
    let gun = gltf.scene;
    gun.scale.set(2,2,2);
    gun.position.set(90,0,0); // ✅ custom
    gun.rotation.set(0, Math.PI/2,0);
    addText(gun,"Damage -5%");
    sliderGroup.add(gun);
    guns[3]=gun;
});

// BUTTONS
document.getElementById("leftBtn").onclick=()=> currentIndex=Math.max(0,currentIndex-1);
document.getElementById("rightBtn").onclick=()=> currentIndex=Math.min(3,currentIndex+1);

// ANIMATION
function animate(){
    requestAnimationFrame(animate);

    let target=-currentIndex*spacing;
    sliderGroup.position.x += (target-sliderGroup.position.x)*0.08;

    guns.forEach((g,i)=>{
        if(!g) return;

        let center=(i===currentIndex);
        let s=center?1.2:0.8;
        g.scale.lerp(new THREE.Vector3(s,s,s),0.1);

        if(center){
            glowLight.position.copy(g.position.clone().add(sliderGroup.position));
        }
    });

    renderer.render(scene,camera);
}
animate();

// AI
const video=document.getElementById("video");
const expText=document.getElementById("expression");

document.getElementById("startAI").onclick=async()=>{
    video.style.display="block";
    expText.style.display="block";

    await faceapi.nets.tinyFaceDetector.loadFromUri("https://justadudewhohacks.github.io/face-api.js/models");
    await faceapi.nets.faceExpressionNet.loadFromUri("https://justadudewhohacks.github.io/face-api.js/models");

    navigator.mediaDevices.getUserMedia({video:true})
    .then(stream=>{
        video.srcObject=stream;
        video.play();
    });
};

video.addEventListener("playing",()=>{
    async function detect(){
        const res=await faceapi.detectSingleFace(video,new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();

        if(res){
            let exp=res.expressions;
            let emotion=Object.keys(exp).reduce((a,b)=>exp[a]>exp[b]?a:b);

            expText.innerText="Emotion: "+emotion;

            if(emotion==="angry") currentIndex=0;
            else if(emotion==="sad") currentIndex=1;
            else if(emotion==="happy") currentIndex=2;
            else currentIndex=3;
        }

        requestAnimationFrame(detect);
    }
    detect();
});

// RESIZE
window.addEventListener("resize",()=>{
    renderer.setSize(window.innerWidth,window.innerHeight);
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
});
</script>

</body>
</html>
