 <!DOCTYPE html>
<html>
<body style="margin:0; background:black; overflow:hidden;">

<div id="box" style="position:absolute; top:0; left:0; width:100vw; height:100vh;"></div>

<!-- AI BUTTON -->
<button id="startAI" style="
position:absolute;
top:20px;
right:20px;
padding:10px 20px;
font-size:16px;
background:#00ffcc;
border:none;
border-radius:8px;
cursor:pointer;
z-index:10;
">
Start AI Mode
</button>

<!-- CAMERA -->
<video id="video" autoplay muted playsinline style="
position:absolute;
right:20px;
bottom:20px;
width:220px;
border:2px solid white;
border-radius:10px;
display:none;
z-index:10;
"></video>

<div id="expression" style="
position:absolute;
right:20px;
bottom:250px;
color:white;
font-size:18px;
font-weight:bold;
display:none;
z-index:10;
">
Detecting...
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<script>
// ================= SCENE =================
let scene = new THREE.Scene();

let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 40;

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById("box").appendChild(renderer.domElement);

// LIGHT
scene.add(new THREE.AmbientLight(0xffffff,0.6));
let glowLight = new THREE.PointLight(0x00ffcc, 2, 100);
scene.add(glowLight);

// ================= SLIDER =================
let sliderGroup = new THREE.Group();
scene.add(sliderGroup);

let currentIndex = 0;
let spacing = 35;

// ================= GUNS =================
let guns = [];

function addText(gun, text){
    let canvas = document.createElement("canvas");
    let ctx = canvas.getContext("2d");

    canvas.width = 512;
    canvas.height = 128;

    ctx.fillStyle = "white";
    ctx.font = "40px Arial";
    ctx.textAlign = "center";
    ctx.fillText(text, 256, 70);

    let texture = new THREE.CanvasTexture(canvas);
    let material = new THREE.SpriteMaterial({ map: texture });
    let sprite = new THREE.Sprite(material);

    sprite.scale.set(15,4,1);
    sprite.position.set(0, -10, 0);

    gun.add(sprite);
}

// Gun 1
new THREE.GLTFLoader().load('pubg_mobile_m4_glacier.glb', (gltf)=>{
    let gun = gltf.scene;
    gun.scale.set(35,35,35);
    gun.position.set(0,0,0);
    gun.rotation.set(0, Math.PI/2,0);
    addText(gun, "Damage +5%");
    sliderGroup.add(gun);
    guns[0] = gun;
});

// Gun 2
new THREE.GLTFLoader().load('ump-45__aggressor.glb', (gltf)=>{
    let gun = gltf.scene;
    gun.scale.set(.8,.8,.8);
    gun.position.set(spacing,0,0);
    gun.rotation.set(0, Math.PI/2,0);
    addText(gun, "Damage -5%");
    sliderGroup.add(gun);
    guns[1] = gun;
});

// Gun 3
new THREE.GLTFLoader().load('awm_godzilla_animated_4k_textures.glb', (gltf)=>{
    let group = new THREE.Group();
    let gun = gltf.scene;

    gun.scale.set(35,35,35);
    gun.rotation.set(0, Math.PI/2,0);

    group.add(gun);
    group.position.set(spacing*2,0,0);

    addText(group, "Damage +5%");
    sliderGroup.add(group);
    guns[2] = group;
});

// Gun 4
new THREE.GLTFLoader().load('p90_hero_v1.glb', (gltf)=>{
    let gun = gltf.scene;
    gun.scale.set(2,2,2);
    gun.position.set(spacing*3,0,0);
    gun.rotation.set(0, Math.PI/2,0);
    addText(gun, "Damage -5%");
    sliderGroup.add(gun);
    guns[3] = gun;
});

// ================= CONTROLS =================
let activeGun = null;
let targetX = 0, targetY = 0;

let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();

function selectGun(x,y){
    let rect = renderer.domElement.getBoundingClientRect();

    mouse.x = ((x - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((y - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    let intersects = raycaster.intersectObjects(guns, true);

    if(intersects.length > 0){
        let obj = intersects[0].object;
        while(obj.parent && !guns.includes(obj)){
            obj = obj.parent;
        }
        activeGun = obj;
    }
}

window.addEventListener("mousedown", e=>selectGun(e.clientX,e.clientY));
window.addEventListener("mouseup", ()=>activeGun=null);

window.addEventListener("mousemove", e=>{
    if(activeGun){
        targetX = e.movementX * 0.01;
        targetY = e.movementY * 0.01;
    }
});

// TOUCH + SLIDE
let startX=0,lastX=0,lastY=0;

window.addEventListener("touchstart", e=>{
    let t=e.touches[0];
    startX=t.clientX;
    selectGun(t.clientX,t.clientY);
    lastX=t.clientX;
    lastY=t.clientY;
});

window.addEventListener("touchmove", e=>{
    let t=e.touches[0];
    if(activeGun){
        targetX=(t.clientX-lastX)*0.01;
        targetY=(t.clientY-lastY)*0.01;
        lastX=t.clientX;
        lastY=t.clientY;
    }
});

window.addEventListener("touchend", e=>{
    let endX=e.changedTouches[0].clientX;

    if(!activeGun){
        if(startX-endX>50) currentIndex++;
        else if(endX-startX>50) currentIndex--;
    }

    currentIndex = Math.max(0, Math.min(3, currentIndex));
    activeGun=null;
});

// ================= ANIMATION =================
function animate(){
    requestAnimationFrame(animate);

    let targetPos = -currentIndex * spacing;
    sliderGroup.position.x += (targetPos - sliderGroup.position.x)*0.08;

    guns.forEach((gun,i)=>{
        if(!gun) return;

        let isCenter = (i === currentIndex);

        let scaleTarget = isCenter ? 1.2 : 0.8;
        gun.scale.lerp(new THREE.Vector3(scaleTarget,scaleTarget,scaleTarget),0.1);

        if(isCenter){
            glowLight.position.copy(gun.position.clone().add(sliderGroup.position));
        }

        if(gun === activeGun){
            gun.rotation.y += targetX;
            gun.rotation.x += targetY;
        } else {
            gun.rotation.y *= 0.95;
            gun.rotation.x *= 0.95;
        }
    });

    renderer.render(scene,camera);
}
animate();

// ================= AI SYSTEM =================
const video = document.getElementById("video");
const expText = document.getElementById("expression");
const btn = document.getElementById("startAI");

btn.onclick = async () => {

    video.style.display = "block";
    expText.style.display = "block";

    await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js/models'),
        faceapi.nets.faceExpressionNet.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js/models')
    ]);

    navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => video.srcObject = stream);
};

video.addEventListener("play", () => {

    async function detect(){

        const res = await faceapi
        .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
        .withFaceExpressions();

        if(res){
            let exp = res.expressions;

            let emotion = Object.keys(exp).reduce((a,b)=>
                exp[a] > exp[b] ? a : b
            );

            expText.innerText = "Emotion: " + emotion;

            // 🎯 EMOTION → GUN
            if(emotion === "angry") currentIndex = 0;
            else if(emotion === "sad") currentIndex = 1;
            else if(emotion === "happy") currentIndex = 2;
            else currentIndex = 3;
        }

        requestAnimationFrame(detect);
    }

    detect();
});

// RESIZE
window.addEventListener("resize", ()=>{
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
});
</script>

</body>
</html>
